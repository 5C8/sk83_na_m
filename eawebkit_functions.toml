# Function boundary overrides for the EAWebkit.xex module (see the
# [[modules]] entry in sk83_na_m_manifest.toml).
#
# Why this file has to exist at all: the main image gets its function table
# from sk83_na_m_config.toml, which carries 56,988 IDA-derived entries. The
# webkit module had no equivalent, so codegen had only its own call-graph walk
# plus .pdata to go on -- and the many small vtable adjustor thunks
# ("mr r3,r4; b <impl>") are reachable ONLY through a vtable slot and carry no
# .pdata entry, so nothing found them. They end up swallowed into whichever
# function precedes them, and the first virtual dispatch to one hits
# ResolveIndirectFunction's InvalidFunctionTrap and aborts (first seen at
# 0x880D2348, during online sign-in).
#
# NOTE: the RTTI vtable scan reports "0 vtables" here, but it does on the main
# image too (both are built /GR-), so that is normal, not the cause.
#
# Two sources, merged:
#
#  1. EAWebkit.xdb -- which is a PDB ("Microsoft C/C++ MSF 7.00"), shipped
#     beside the xex. Its publics + S_GPROC32 records give 901 real function
#     addresses in .text (section 3, RVA 0xC0000 -> 0x880C0000). 846 of them
#     landed INSIDE an already-generated function, i.e. exactly the missed
#     boundaries described above; only 1 of 901 fell outside the code range,
#     which is what confirms the section mapping. The PDB only covers roughly
#     0x8838D848-0x884FF4D8, so it is not a complete table.
#  2. For the rest of .text, uncovered runs found by diffing each recompiled
#     function's extent against the next function's start, iterated with
#     codegen's own "Unresolved b target" and Validate "target not in any
#     function" diagnostics until no source named a new address.
#
# Ends/parents are left for codegen to infer. Regenerate if EAWebkit.xex
# changes; this is specific to the sk8-xbox2-na-milestone build.
#
# 0x884CD530 came from the compiler rather than codegen: a "bl 0x884cd530"
# was lowered as "goto loc_884CD530" into a label that was never emitted
# ("use of undeclared label"), i.e. codegen placed the target inside the
# calling function instead of treating it as its own. Listing it here turns
# the branch back into a call.


# EAWebKit statically links its own copy of the CRT setjmp/longjmp (libpng and
# libjpeg's error/decode control flow runs through them). Without these, codegen
# treats them as plain functions and every PNG/JPEG in the in-game browser fails to
# draw (the pages load, but every image is an empty box). Located from retail's
# pair (skate3recomp config: setjmp 0x88478D00, longjmp 0x884789E0): two of retail's
# setjmp call-site lead-ins (stw r11,1892(r3); stb r5,4(r11)) call 0x884CF9E0 here;
# its body is the CRT setjmp (lis/lwz of the module's setjmp hook, mtctr/bnectr,
# mflr, mfcr...), and longjmp sits the same 0x320 bytes before it as in retail.
# (EAWebkit.xdb's setjmp/longjmp S_GPROC32 offsets do NOT map to these with the
# section-3 base used for the function table - 0x884CEBC0 there is a file reader.)
setjmp_address = 0x884CF9E0
longjmp_address = 0x884CF6C0

